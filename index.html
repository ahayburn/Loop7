<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Loop 7</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="lib/fonts.css">
<style>
/* Layout: a slate-board manager. Films list, then scenes in order, then a storyboard grid of shots; a shot opens the full-bleed 3D camera stage with a side panel (stacks under the stage on phones). One committed dark look, like a dim set. */
:root{
  --bg:#0b1110; --panel:#121a19; --card:#0f1716; --line:#24302e; --line2:#33423f;
  --fg:#e6e2d8; --muted:#8f9a96; --slate:#1f4a40; --amber:#e0a35a; --ink:#1a1208; --ok:#5ef08a; --bad:#e8745e;
  --display:"Big Shoulders Display","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45}
button{font:inherit;color:inherit}
input,textarea,select{box-sizing:border-box;max-width:100%}
.ico{width:14px;height:14px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- home pages ---------- */
.page{min-height:100%;padding-block:22px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:22px;min-width:0}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--bg);padding:12px 0;margin:-12px 0;border-bottom:1px solid var(--line)}
.crumbs button{all:unset;cursor:pointer;color:var(--amber)}
.crumbs button:hover{text-decoration:underline}
.crumbs .copybtn{margin-left:auto;border:1px solid var(--line2);border-radius:4px;padding:6px 10px;min-height:30px;display:inline-flex;align-items:center;color:var(--fg);font-size:11px;letter-spacing:.08em;text-decoration:none}
.crumbs .copybtn:hover{border-color:var(--amber);text-decoration:none}
.mbox textarea{font:13px/1.5 var(--mono);color:var(--fg);background:var(--card);border:1px solid var(--line2);border-radius:4px;padding:10px;width:100%;box-sizing:border-box;min-height:40vh;resize:vertical}
.crumbs button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
h1{font-family:var(--display);font-weight:800;font-size:44px;letter-spacing:.02em;line-height:1;margin:0;text-transform:uppercase;text-wrap:balance}
h1 span{color:var(--amber)}
.sub{color:var(--muted);margin:8px 0 0;max-width:62ch}
h2{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:500}
h3{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1.05}
.hd{display:flex;flex-direction:column;gap:6px;min-width:0}
.hd label{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.title-input{font-family:var(--display);font-weight:800;font-size:40px;letter-spacing:.02em;text-transform:uppercase;line-height:1.05;color:var(--fg);background:transparent;border:0;border-bottom:1px dashed transparent;padding:2px 0;width:100%;min-width:0;border-radius:0}
.title-input:hover{border-bottom-color:var(--line2)}
.title-input:focus{outline:none;border-bottom:1px solid var(--amber)}
.title-input:disabled{opacity:.7}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.meta{font-family:var(--mono);font-size:12px;color:var(--muted)}
.btn{all:unset;box-sizing:border-box;cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:8px 12px;border-radius:4px;border:1px solid var(--line2);color:var(--fg);display:inline-flex;align-items:center;gap:8px;min-height:34px}
.btn:hover{border-color:var(--amber)}
.btn:focus-visible,.iconbtn:focus-visible,.open:focus-visible,.thumbbtn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.btn.primary{background:var(--amber);border-color:var(--amber);color:var(--ink);font-weight:500}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger:hover,.btn.armed{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:default;border-color:var(--line)}
.iconbtn{all:unset;box-sizing:border-box;cursor:pointer;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:4px;border:1px solid var(--line2);color:var(--fg)}
.iconbtn:hover{border-color:var(--amber);color:var(--amber)}
.iconbtn[disabled]{opacity:.3;cursor:default;border-color:var(--line);color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.field select,.field textarea,.field input{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line2);border-radius:4px;padding:8px 10px;min-width:0;width:100%}
.field textarea{resize:vertical;min-height:64px}
.field select:focus,.field textarea:focus,.field input:focus{outline:2px solid var(--amber);outline-offset:0}
.empty{border:1px dashed var(--line2);border-radius:6px;padding:28px 20px;color:var(--muted);max-width:60ch}
.empty b{color:var(--fg);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:16px}

/* thumbnails */
.thumb{position:relative;aspect-ratio:16/9;background:var(--card);border:1px solid var(--line);border-radius:4px;overflow:hidden;min-width:0}
.thumb img{display:block;width:100%;height:100%;object-fit:cover}
.thumb.none{background:repeating-linear-gradient(135deg,#0f1716 0 10px,#121c1b 10px 20px)}
.thumb.none::after{content:"NO FRAME YET";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--muted)}
.mosaic .thumb.none::after,.strip .thumb.none::after{content:""}
.chip{position:absolute;font-family:var(--mono);font-size:11px;padding:2px 6px;border-radius:3px;background:rgba(5,8,7,.78);color:var(--fg);display:flex;align-items:center;gap:5px}
.chip.num{left:6px;top:6px;color:var(--amber)}
.chip.lens{right:6px;bottom:6px}
.chip.lock{right:6px;top:6px;color:var(--muted)}

/* films */
.filmwrap{display:flex;flex-direction:column;gap:8px;min-width:0}
.filmwrap .btn{justify-content:center}
.filmcard{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:6px;padding:12px;background:var(--panel);min-width:0}
.filmcard:hover{border-color:var(--amber)}
.filmcard:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.mosaic{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.newcard{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;border:1px dashed var(--line2);border-radius:6px;min-height:120px;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:12px}
.newcard:hover{border-color:var(--amber);color:var(--amber)}
.newcard:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* scenes */
.scenes{display:flex;flex-direction:column;gap:10px}
.scenerow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:stretch;border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:10px}
.ord{display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:6px;font-family:var(--mono);font-size:12px;color:var(--amber)}
.open{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,300px);gap:14px;align-items:center;min-width:0;border-radius:4px}
.open:hover h3{color:var(--amber)}
.info{display:flex;flex-direction:column;gap:6px;min-width:0}
.info p{margin:0;color:var(--muted)}
.info .notes{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.strip .thumb{border-radius:3px}

/* storyboard */
.scenehead{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.shot{display:flex;flex-direction:column;gap:8px;min-width:0}
.thumbbtn{all:unset;box-sizing:border-box;cursor:pointer;display:block;border-radius:4px}
.thumbbtn:hover .thumb{border-color:var(--amber)}
.cap{display:flex;align-items:center;gap:8px;min-width:0}
.cap .nm{flex:1;min-width:0;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cap .mv{display:flex;gap:4px}
.cap .iconbtn{width:30px;height:30px}

/* ---------- shot stage ---------- */
.app{display:grid;grid-template-columns:1fr 320px;height:100%;min-height:0}
.stage{position:relative;min-width:0;min-height:0;background:#050807;overflow:hidden}
.stage canvas{display:block;width:100%;height:100%;outline:none}
.hudbar{flex:none;display:flex;justify-content:space-between;gap:12px;align-items:center;min-height:26px;padding:5px max(12px,env(safe-area-inset-left,0px));background:#050807;font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--muted);white-space:nowrap;overflow:hidden}
.hudbar>*{overflow:hidden;text-overflow:ellipsis}
.hudbar b{color:var(--amber);font-weight:500}
.hudbar:empty{display:none}
#topBar{min-height:36px}
#topBar .back{min-width:0;flex:0 1 auto;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:6px 0}
#topBar #hudShot{flex:none}
.frame{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center}
.frame div{outline:1px dashed rgba(224,163,90,.7);outline-offset:-1px;box-shadow:0 0 0 200vmax rgba(0,0,0,.68)}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);color:var(--muted);background:#050807}
aside{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding-block:18px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px;min-width:0}
.back{all:unset;cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);display:inline-flex;align-items:center;gap:6px}
.back:hover{text-decoration:underline}
.back:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin-bottom:2px}
aside .title-input{font-size:30px}
.pn{display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.lensrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.lensrow label{font-family:var(--mono);font-size:11px;color:var(--muted);grid-column:1/-1}
.lensrow input[type=range]{width:100%;accent-color:var(--amber);min-width:0}
.lensrow output{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.setrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.status{font-family:var(--mono);font-size:11px;color:var(--muted)}
.status.ok{color:var(--ok)}
.status.warn{color:var(--amber)}
.toggles{display:flex;flex-direction:column;gap:9px}
.toggles label{display:flex;gap:10px;align-items:center;cursor:pointer}
.toggles input{accent-color:var(--amber);width:16px;height:16px;flex:none}
aside.locked .toggles label.edit{opacity:.55;cursor:default}
.help{font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.6;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:#0b1110;padding:9px 14px;border-radius:5px;font-size:13px;z-index:30;max-width:calc(100% - 32px)}

/* stage 2: tags, runtime, details */
.pill{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.pill.previs{color:var(--amber);border-color:rgba(224,163,90,.55)}
.pill.generated{color:#7fe6d4;border-color:rgba(127,230,212,.5)}
.pill.approved{color:var(--ok);border-color:rgba(94,240,138,.5)}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:20px}
.tags .sz{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.runtime{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:6px;padding:12px;background:var(--panel)}
.runtime .row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.runtime .big{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.runtime .big small{font-family:var(--mono);font-weight:400;font-size:12px;color:var(--muted);margin-left:6px}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--amber);border-radius:3px}
.meter.over i{background:var(--bad)}
.tgt{display:flex;align-items:center;gap:8px}
.tgt input{width:84px;font:inherit;font-family:var(--mono);color:var(--fg);background:var(--card);border:1px solid var(--line2);border-radius:4px;padding:6px 8px}
.tgt label{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reflist{display:flex;flex-direction:column;gap:8px}
.refrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,170px) auto;gap:8px;align-items:center}
.refrow input,.refrow select{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line2);border-radius:4px;padding:7px 9px;min-width:0;width:100%}
.refrow input:focus,.refrow select:focus,.tgt input:focus{outline:2px solid var(--amber)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
aside .field select,aside .field textarea,aside .field input{font-size:13px}
.checks{display:flex;flex-direction:column;gap:8px}
.checks label{display:flex;gap:10px;align-items:center;cursor:pointer}
.checks input{accent-color:var(--amber);width:16px;height:16px;flex:none}
/* scene headings and backup */
.scriptbox{font-family:'Courier New',Courier,monospace;font-size:14px;line-height:1.5;min-height:140px}
.scriptview{width:100%;max-width:64ch;margin:0 auto;box-sizing:border-box}
.scriptview .sl{font-family:'Courier New',Courier,monospace;font-weight:700;text-transform:uppercase;color:var(--amber);margin:28px 0 8px;font-size:15px}
.scriptview pre{color:#ffffff!important;font-family:'Courier New',Courier,monospace;font-size:14px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;margin:0;color:var(--text)}
.scriptview .sn{font-family:'Courier New',Courier,monospace;font-size:14px;color:#c9d2cc;margin:0 0 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.scriptview .sl{margin-bottom:2px}
.scriptview .sl+pre,.scriptview .sl+.none{margin-top:8px}
.scriptview .sa{font-family:'Courier New',Courier,monospace;font-size:14px;color:#c9d2cc;margin:18px 0 4px;white-space:pre-wrap;overflow-wrap:anywhere}
.scriptview pre+pre{margin-top:14px}
.scriptview .dl{margin:16px 0 0}
.scriptview .dn{font-family:'Courier New',Courier,monospace;font-size:14px;font-weight:700;text-transform:uppercase;text-align:center;color:#fff;letter-spacing:.04em}
.scriptview .dp{font-family:'Courier New',Courier,monospace;font-size:14px;color:#fff;text-align:center}
.scriptview .dt{font-family:'Courier New',Courier,monospace;font-size:14px;line-height:1.55;color:#fff;text-align:center;max-width:34ch;margin:2px auto 0;white-space:pre-wrap;overflow-wrap:anywhere}
.dlg{border:1px solid var(--line);border-radius:6px;padding:10px;margin-top:8px;display:grid;gap:8px}
.charrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-bottom:8px}
.scriptview .sedit{display:block;width:100%;box-sizing:border-box;background:transparent;border:0;border-bottom:1px dashed transparent;border-radius:0;color:inherit;font:inherit;line-height:1.55;resize:none;overflow:hidden;padding:0;margin:0;outline:0;min-height:0}
.scriptview .sedit:focus{border-bottom-color:var(--amber)}
.scriptview .sea{color:#c9d2cc}
.scriptview .sed{text-align:center;color:#fff}
.scriptview .sedit-n{font:inherit;color:#fff;background:transparent;border:0;border-bottom:1px dashed transparent;text-align:center;padding:0;outline:0;width:auto;max-width:80%}
.scriptview .sedit-n:focus{border-bottom-color:var(--amber)}
.scriptview .sa .sedit{width:100%}
.scriptview .none{color:#aab5ae;font-style:italic}
.slug{font-family:var(--mono);font-weight:500;font-size:22px;letter-spacing:.04em;color:var(--amber);text-transform:uppercase;line-height:1.25;overflow-wrap:anywhere}
.slugrow{display:grid;grid-template-columns:150px minmax(0,1fr) 190px;gap:10px}
.backup{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:18px}
.restore{border:1px solid var(--amber);border-radius:6px;padding:14px;background:var(--panel);display:flex;flex-direction:column;gap:10px}
.restore p{margin:0}
.btn[aria-pressed=true]{background:var(--amber);border-color:var(--amber);color:var(--ink)}
.actrow{border-top:1px solid var(--line);padding:10px 0;display:flex;flex-direction:column;gap:8px}
.actrow .bar{margin:0}
.actrow>.two:first-child{grid-template-columns:minmax(0,1fr)}
.actctl{border:1px solid var(--amber);padding:10px;margin-top:10px;display:flex;flex-direction:column;gap:8px}
#shotview.playing{grid-template-columns:1fr}
#shotview.playing #panel{display:none}
#shotview.playing{grid-template-rows:minmax(0,1fr) auto auto auto}
#shotview.playing .hudbar{display:none}
#frame.cine div{outline:none;box-shadow:0 0 0 200vmax #000}
.playbar[hidden],.recwarn[hidden],.playdetail[hidden]{display:none}
.recwarn{background:#c8281a;color:#fff;font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.04em;text-align:center;padding:10px 12px;animation:recpulse 1.2s ease-in-out infinite}
@keyframes recpulse{50%{background:#8f1a10}}
.playdetail{padding:12px 14px 20px;background:#0a0f0d;overflow:auto;max-height:34vh}
.playdetail h3{margin:0 0 6px;font-size:18px;font-weight:500}
.playdetail .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.playdetail .chips span{font-family:var(--mono);font-size:11px;border:1px solid var(--line);padding:2px 7px;color:var(--muted)}
.playdetail p{margin:0 0 8px;font-size:13px;line-height:1.45;color:var(--text);white-space:pre-wrap}
.playdetail .pscript{font-family:'Courier New',Courier,monospace;margin-bottom:8px}
.playdetail .pscript .sa{margin:10px 0 0;font-size:14px;color:#c9d2cc}
.playdetail .pscript .dl{margin:12px 0 0}
.playdetail .pscript .dn,.playdetail .pscript .dp,.playdetail .pscript .dt{font-size:14px;color:#fff;text-align:center;font-weight:400}
.playdetail .pscript .dn{font-weight:700;text-transform:uppercase}
.playdetail .pscript .dt{max-width:34ch;margin:2px auto 0;white-space:pre-wrap}
.playdetail .lab{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:2px}
.playchk{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--muted);cursor:pointer;min-height:32px}
.playchk input{width:20px;height:20px;accent-color:var(--amber);margin:0}
.stagecol{display:flex;flex-direction:column;min-width:0;min-height:0}
.stagecol .stage{flex:1 1 auto}
.movebar{position:relative;flex:none;z-index:5;display:flex;align-items:center;gap:10px;padding:8px 12px;background:#050807;border-top:1px solid var(--line);font-family:var(--mono);font-size:11px;color:var(--text)}
.movebar[hidden]{display:none}
.veil{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:4}
.cardlayer{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;background:#000}
.cardbox{display:flex;align-items:center;justify-content:center;overflow:hidden}
.cardbox img{max-width:62%;max-height:70%;display:block}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.mbox{background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:18px;width:min(100%,380px);display:flex;flex-direction:column;gap:12px}
.mbox h3{margin:0}
.tlfade{position:absolute;top:0;bottom:0;pointer-events:none;z-index:1}
.tlfade.in{left:0;background:linear-gradient(90deg,rgba(0,0,0,.85),rgba(0,0,0,0))}
.tlfade.out{right:0;background:linear-gradient(270deg,rgba(0,0,0,.85),rgba(0,0,0,0))}
.movebar input[type=range]{flex:1;min-width:0}
.movebar .fno{white-space:nowrap;color:var(--muted)}
.movebar{flex-direction:column;align-items:stretch;gap:6px}
.tl{display:flex;flex-direction:column;gap:6px;width:100%}
.tlrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tlrow .sp{flex:1}
.tlrow .btn{min-height:32px;padding:6px 10px}
.tlstrip{display:flex;align-items:stretch;gap:8px}
.tlname{flex:none;width:60px;align-self:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--amber)}
.tlin{position:relative;flex:1;min-width:0;height:44px;margin:0 12px;touch-action:none;cursor:ew-resize;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);background:rgba(255,255,255,.03)}
.tlin .tick{position:absolute;bottom:0;width:1px;height:9px;background:var(--line2);pointer-events:none}
.tlin .tick.minor{height:5px}
.tlin .tlab{position:absolute;top:1px;transform:translateX(-50%);font-weight:400;font-size:10px;color:var(--muted);pointer-events:none}
.tkey{all:unset;box-sizing:border-box;position:absolute;top:26px;width:28px;height:28px;margin:-14px 0 0 -14px;cursor:grab;touch-action:none;z-index:2}
.tkey::before{content:"";position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;transform:rotate(45deg);background:var(--amber);border:1px solid var(--ink)}
.tkey.on::before{outline:2px solid #fff}
.tkey:focus-visible::before{outline:2px solid #fff}
.tlhead{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:#ff3d1f;pointer-events:none;z-index:3}
.tlhead::before{content:"";position:absolute;top:0;left:-5px;border:6px solid transparent;border-top-color:#ff3d1f}
#panel.refmode .edctl,.movebar.refmode .tlin,.movebar.refmode [data-sv=key-set],.movebar.refmode [data-sv=key-del]{pointer-events:none;opacity:.4}
#shotview.playing .movebar{display:none}
.playbar{display:flex;align-items:center;gap:12px;background:#0a0f0d;border-top:1px solid var(--line);padding:10px 12px;font-family:var(--mono);font-size:12px;color:var(--text)}
.playbar{flex-wrap:wrap}
.playbar span{flex:1 1 100%;min-width:0}
.playbar .exitrow{width:100%;display:flex;justify-content:center}
.playbar .exitrow .btn{min-width:140px}
.playbar .transport{display:flex;flex-wrap:nowrap;gap:4px;align-items:center;width:100%;justify-content:center}
.playbar .transport[hidden],.playbar .tp[hidden]{display:none}
.playbar .tp{min-width:0;flex:0 1 auto;padding-left:9px;padding-right:9px}
.playbar .transport .btn{padding-left:9px;padding-right:9px}
.playbar .rec{color:#ff6a5a}
@media (max-width:760px){
  #shotview.playing{grid-template-rows:calc(100vw*9/16) auto auto auto;height:auto}
  .playdetail{max-height:none}
  .slugrow{grid-template-columns:minmax(0,1fr)}
  .refrow{grid-template-columns:minmax(0,1fr) auto}
  .refrow select{grid-column:1}
  h1{font-size:36px}
  .title-input{font-size:32px}
  .open{grid-template-columns:minmax(0,1fr)}
  .scenehead{grid-template-columns:minmax(0,1fr)}
  .app{grid-template-columns:1fr;grid-template-rows:50vh auto;height:auto}
  #shotview:not(.playing) .stagecol{position:sticky;top:0;z-index:30;border-bottom:1px solid var(--line)}
  aside{border-left:0;border-top:1px solid var(--line)}
}
/* 16px text in fields stops iOS from zooming the page when a field is focused */
@media (pointer:coarse){input:not([type=range]):not([type=checkbox]),select,textarea,aside .field select,aside .field textarea,aside .field input,.scriptbox{font-size:16px!important}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

<script>
(function(){

  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const iso=()=>new Date().toISOString();
  const DEG=String.fromCharCode(176);
  const I={
    up:'<svg class="ico" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>',
    down:'<svg class="ico" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>',

  /* ---------- 3D sets this tool knows how to show ---------- */
  const SETS={
    suite:{
      name:'Hotel suite, corridor and lobby (one model)',file:'suite.txt',
      actors:[
        {id:'agent',name:'Agent in the tub (burst pose)',re:/(^|\|)A_/},
        {id:'floor',name:'Agent on the bathroom floor (fetal)',re:/(^|\|)F_/},
        {id:'room',name:'Agent at the foot of the bed',re:/(^|\|)B_/},
        {id:'enter',name:'Agent stepping into the suite',re:/(^|\|)N_/},
        {id:'door',name:'Agent at her room door (corridor)',re:/(^|\|)D_/},
        {id:'walk',name:'Agent walking, mid-corridor',re:/(^|\|)W_/},
        {id:'lift',name:'Agent in the lobby, facing the elevators',re:/(^|\|)E_/}
      ],
      zones:{
        bath:{box:[2.71, 3.54, -1, 7.2, 8.21, 4.5],lights:[{c:0xffc690,i:1.6,d:9,p:[4.855,4.5,1.9]},{c:0x7fe6e6,i:0.7,d:7,p:[6.955,7.35,2.4]},{c:0xffcc8a,i:1.0,d:6,p:[3.455,5.15,1.8]}]},
        foyer:{box:[2.71, 0, -1, 7.2, 3.54, 4.5],lights:[{c:0xffc78f,i:1.0,d:7,p:[4.9,1.9,3.0]}]},
        bed:{box:[7.2, 0, -1, 12.55, 7.36, 4.5],lights:[{c:0xffc78f,i:1.1,d:9,p:[9.8,3.6,3.0]},{c:0xffb070,i:0.7,d:5,p:[7.9,6.89,1.1]},{c:0xffb070,i:0.7,d:5,p:[11.7,6.89,1.1]},{c:0xffc78f,i:0.8,d:7,p:[11.5,2.0,2.4]}]},
        hall:{box:[0, 0, -1, 2.56, 18.288, 4.5],lights:[{c:0xffc78f,i:1.1,d:8,p:[1.28,2.5,2.9]},{c:0xffc78f,i:1.1,d:8,p:[1.28,7.5,2.9]},{c:0xffc78f,i:1.1,d:8,p:[1.28,12.5,2.9]}]},

      home:{pos:[3.2,2.2,1.55],tgt:[11.0,3.7,1.0],lens:16},
      props:()=>buildSuiteProps(),
      views:[
        {id:'room',name:'Suite from the door',lens:16,pos:[3.2,2.2,1.55],tgt:[11.0,3.7,1.0]},
        {id:'bath',name:'Bathroom door',lens:18,pos:[4.055,2.3,1.55],tgt:[5.35,6.8,1.0]},
        {id:'hall',name:'Down the corridor',lens:18,pos:[1.28,0.6,1.6],tgt:[1.28,9.0,1.4]},
        {id:'lobby',name:'Lobby',lens:16,pos:[0.4,14.6,1.6],tgt:[-5.0,18.0,1.4]},
        {id:'ohsuite',name:'Overhead suite',lens:18,pos:[7.5,3.9,9],tgt:[7.5,3.9,0],overhead:true},
        {id:'ohfloor',name:'Overhead whole floor',lens:18,pos:[1.9,9.15,21],tgt:[1.9,9.15,0],overhead:true}
      ],
      info:'One model: her suite, the corridor, and the elevator lobby share one coordinate system, so a single camera move can follow her out of the room. Suite: foyer with built-in wardrobe, bathroom beside the entry, king bedroom (about 5.2 x 7.0 m) with wall-mounted TV, desk, lounge chair and a window wall. Real-world luxury sizes scaled +20%, ceiling 3.29 m. Lights are grouped by area and follow the camera.'
    }
  };
  /* ---------- actors: placed poses (position + facing, start and optional end) ---------- */
  const uid=()=>'c'+Math.random().toString(36).slice(2,8);
  const POSES=[['stand','Standing'],['walk','Walking (mid-stride)'],['fetal','Lying on the floor'],['tub','Hunched in the tub'],['pair_down','Mother and daughter, hands held'],['pair_point','Mother and daughter, girl pointing']];
  const EYE={stand:1.62,walk:1.62,fetal:0.3,tub:0.95};
  const PI=Math.PI,BOFF=[4.955,3.55];
  const LEG_BATH={agent:{n:'Agent (tub)',pose:'tub',x:1.463,y:3.051,yaw:PI},floor:{n:'Agent (floor)',pose:'fetal',x:0.312,y:1.85,yaw:-PI/2}};
  const LEG_HALL={door:{n:'Agent (door)',pose:'stand',x:2.01,y:2.2,yaw:PI/2},walk:{n:'Agent (walking)',pose:'walk',x:1.28,y:9,yaw:0},lift:{n:'Agent (lobby)',pose:'stand',x:-4.4,y:16.093,yaw:0}};
  const sh2=o=>Object.assign({},o,{x:+(o.x+BOFF[0]).toFixed(3),y:+(o.y+BOFF[1]).toFixed(3)});
  const LEGACY={bathroom:LEG_BATH,hall:LEG_HALL,suite:Object.assign({agent:sh2(LEG_BATH.agent),floor:sh2(LEG_BATH.floor),
    room:{n:'Agent (bedroom)',pose:'stand',x:9.8,y:3.9,yaw:0},enter:{n:'Agent (entering)',pose:'walk',x:4.21,y:2.2,yaw:-PI/2}},LEG_HALL)};
  function legacyCast(sh){
    const sc=scn(sh.sceneId);const sid=sc&&SETS[sc.setId]?sc.setId:Object.keys(SETS)[0];const t=LEGACY[sid]||{};
    return Object.keys(sh.actors||{}).filter(k=>sh.actors[k]&&t[k]).map(k=>({id:'l_'+k,name:t[k].n,pose:t[k].pose,a:{x:t[k].x,y:t[k].y,yaw:t[k].yaw},b:null}));
  }
  const dupv=a=>[...a];
  // every shot carries cam_keys (camera) and every actor carries keys; the older start/end fields are kept in step for compatibility
  function normCam(sh){
    const N=Math.max(2,Math.round(Math.max(0.5,+sh.duration_s||3)*24));
    if(!Array.isArray(sh.cam_keys)||!sh.cam_keys.length){
      const ks=[{f:(sh.cam_f&&sh.cam_f.start)||0,lens_mm:sh.lens_mm,position_m:dupv(sh.position_m),target_m:dupv(sh.target_m)}];
      if(sh.cam_end)ks.push({f:sh.cam_f&&sh.cam_f.end!=null?sh.cam_f.end:N,lens_mm:sh.cam_end.lens_mm,position_m:dupv(sh.cam_end.position_m),target_m:dupv(sh.cam_end.target_m)});
      sh.cam_keys=ks;
    }
  }
  function syncCam(sh){
    const N=Math.max(2,Math.round(Math.max(0.5,+sh.duration_s||3)*24));const k=sh.cam_keys,k0=k[0],kl=k[k.length-1];
    sh.lens_mm=k0.lens_mm;sh.position_m=dupv(k0.position_m);sh.target_m=dupv(k0.target_m);
    sh.cam_end=k.length>1?{lens_mm:kl.lens_mm,position_m:dupv(kl.position_m),target_m:dupv(kl.target_m)}:null;
    sh.cam_f=k.length>1?{start:k0.f||0,end:kl.f>=N?null:kl.f}:((k0.f||0)?{start:k0.f,end:null}:null);
  }
  function normActor(c,sh){
    const N=Math.max(2,Math.round(Math.max(0.5,+sh.duration_s||3)*24));
    if(!Array.isArray(c.keys)||!c.keys.length){
      const ks=[Object.assign({},c.a,{f:(c.f&&c.f.start)||0})];
      if(c.b)ks.push(Object.assign({},c.b,{f:c.f&&c.f.end!=null?c.f.end:N}));
      c.keys=ks;
    }
  }
  function syncActor(c,sh){
    const N=Math.max(2,Math.round(Math.max(0.5,+sh.duration_s||3)*24));const k=c.keys,k0=k[0],kl=k[k.length-1];
    const strip=o=>{const r=Object.assign({},o);delete r.f;return r;};
    c.a=strip(k0);c.b=k.length>1?strip(kl):null;
    c.f=k.length>1?{start:k0.f||0,end:kl.f>=N?null:kl.f}:((k0.f||0)?{start:k0.f,end:null}:null);
  }
  // a shot's script is an ordered list of sections: action text or one character's line (with an optional context note)
  function shotSecs(sh){
    if(Array.isArray(sh.sections))return sh.sections;
    const out=[];
    if((sh.notes||'').trim())out.push({id:'m_n',type:'action',text:sh.notes});
    if((sh.script||'').trim())out.push({id:'m_s',type:'action',text:sh.script});
    (sh.dialogue||[]).forEach(d=>out.push({id:d.id,type:'dialogue',char:d.char,note:d.note||'',text:d.text||''}));
    return out;
  }
  const actionText=sh=>shotSecs(sh).filter(x=>x.type==='action'&&(x.text||'').trim()).map(x=>x.text.trim()).join('\n');
  const ensureCast=sh=>{if(!Array.isArray(sh.sections))sh.sections=JSON.parse(JSON.stringify(shotSecs(sh)));if(!Array.isArray(sh.cast))sh.cast=legacyCast(sh);sh.cast.forEach(c=>normActor(c,sh));if(!Array.isArray(sh.set_keys)||!sh.set_keys.length)sh.set_keys=[{f:0,intensity:1}];if(!Array.isArray(sh.lights))sh.lights=[];sh.lights.forEach(l=>{if(!Array.isArray(l.keys)||!l.keys.length)l.keys=[{f:0,x:0,y:0,z:1.5,yaw:0,pitch:0,intensity:2,on:true}];});normCam(sh);return sh.cast;};
  const hasMove=sh=>(Array.isArray(sh.cam_keys)?sh.cam_keys.length>1:!!sh.cam_end)||(Array.isArray(sh.cast)&&sh.cast.some(c=>Array.isArray(c.keys)?c.keys.length>1:!!c.b))||(Array.isArray(sh.lights)&&sh.lights.some(l=>l.keys&&l.keys.length>1))||(Array.isArray(sh.set_keys)&&sh.set_keys.length>1);
  SETS.street={
    name:'Street with crosswalk and distant hotel',
    build:()=>buildStreetSet(),smoke:true,far:600,fog:{c:0xd3dcdf,n:60,f:260},actors:[],
    info:'A two-lane street with a crosswalk at the origin. It narrows toward the hotel at the far end, which is a 40 m tower placed 100 m away (forced perspective). Turn the hotel smoke on or off per shot.',
    home:{pos:[-5.2,-7.5,1.6],tgt:[2,30,7],lens:24},
    views:[
      {id:'cross',name:'Crosswalk, low',lens:28,pos:[-4.6,-3.0,0.45],tgt:[1.0,3.0,0.15]},
      {id:'down',name:'Down the street',lens:22,pos:[-3.2,-9,1.6],tgt:[5,60,8]},
      {id:'hotel',name:'The hotel',lens:55,pos:[-2,10,1.7],tgt:[7,100,24]},
      {id:'oh',name:'Overhead street',lens:24,pos:[0,30,60],tgt:[0,30,0],overhead:true}
    ]
  };
  const setOf=id=>SETS[id]||SETS[Object.keys(SETS)[0]];
  const STATUS=[['planned','Planned'],['previs','Previs rendered'],['generated','Seedance generated'],['approved','Approved']];
  const SIZES=[['wide','Wide / Establishing','Wide'],['medium','Medium / Over-the-shoulder','Medium'],['close','Close-up / Extreme close-up','Close-up'],['insert','Insert / Overhead / POV','Insert']];
  const RES=['480p','720p','1080p'],QUAL=['Standard','High'],MODELS=['Seedance 2.5','Other'];
  const REF_KINDS=['Character','Set image','Start/end frame','Previs clip','Other'];
  const LOC_TYPES=['INT.','EXT.','INT./EXT.','EXT./INT.'];
  const TIMES=['DAY','NIGHT','DAWN','DUSK','MORNING','AFTERNOON','EVENING','LATER','CONTINUOUS','MOMENTS LATER','SAME'];
  const sceneTitle=s=>[s.loc_type||'',String(s.name||'Untitled scene').toUpperCase(),s.time_of_day?'- '+s.time_of_day:''].filter(Boolean).join(' ');
  const stLabel=v=>(STATUS.find(x=>x[0]===v)||STATUS[0])[1];
  const szShort=v=>(SIZES.find(x=>x[0]===v)||[,,''])[2];
  const fmt=sec=>{sec=Math.round(sec||0);return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');};
  const parseTime=t=>{t=String(t).trim();if(!t)return null;if(t.includes(':')){const [m,s2]=t.split(':');const v=(+m)*60+(+s2||0);return isNaN(v)?null:v;}const v=+t;return isNaN(v)?null:v;};
  const secs=list=>list.reduce((a,x)=>a+(+x.duration_s||0),0);
  const opt=(arr,val,blank)=>(blank?`<option value="">${blank}</option>`:'')+arr.map(a=>{const v=Array.isArray(a)?a[0]:a,l=Array.isArray(a)?(a[1]):a;return `<option value="${esc(v)}"${v===val?' selected':''}>${esc(l)}</option>`;}).join('');

  /* ---------- data ---------- */
  let db=null;
  const data={films:[],scenes:[],shots:[]};
  const ready={films:false,scenes:false,shots:false};
  const byOrder=(a,b)=>(a.order||0)-(b.order||0);
  const nextOrder=l=>l.length?Math.max(...l.map(x=>x.order||0))+1:0;
  const film=id=>data.films.find(x=>x.id===id);
  const scn=id=>data.scenes.find(x=>x.id===id);
  const shotById=id=>data.shots.find(x=>x.id===id);
  const scenesOf=fid=>data.scenes.filter(s=>s.filmId===fid).sort(byOrder);
  const shotsOf=sid=>data.shots.filter(s=>s.sceneId===sid).sort(byOrder);
  const shotsOfFilm=fid=>scenesOf(fid).flatMap(s=>shotsOf(s.id));
  const inPlay=x=>x.play!==false;
  const playShotsOfScene=sid=>shotsOf(sid).filter(inPlay);
  const playShotsOfFilm=fid=>scenesOf(fid).filter(inPlay).flatMap(s=>playShotsOfScene(s.id));
  const plural=(n,w)=>n+' '+w+(n===1?'':'s');

  let toastT=0;
  function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true;},3800);}
  let inflight=0,lastWrite=0;
  async function W(p,msg){
    if(!db){toast('Saving is not available in this view. Open the page signed in to claude.ai.');return false;}
    inflight++;
    try{
      await Promise.race([Promise.resolve(p),new Promise((_,rj)=>setTimeout(()=>rj({code:'timeout'}),20000))]);
      return true;}
    catch(e){if(e&&e.code==='timeout'){toast('Saving is slow. It may still finish; check the status.');return false;}toast(e&&e.code==='invalid_argument'?'You can view this tool but not change it.':(msg||'Not saved. Try again.'));return false;}
    finally{inflight=Math.max(0,inflight-1);lastWrite=Date.now();}
  }

  /* ---------- navigation ---------- */
  const nav={view:'films',film:null,scene:null,shot:null};
  let navReady=false;

  const crumbBtn=(label,act,id)=>`<button type="button" data-act="${act}"${id?` data-id="${esc(id)}"`:''}>${esc(label)}</button>`;

  // A film's cover is always three frames, in film order. One fixed-but-random frame from each scene
  // (first, middle and last scene when there are more than three); if there are fewer than three scenes,
  // extra frames come from the shots of the scenes it has.
  const hashStr=str=>{let h=0;for(const ch of str)h=(h*31+ch.charCodeAt(0))>>>0;return h;};
  function filmCover(fid){
    const pool=scenesOf(fid).map((sc,i)=>({sc,i,list:shotsOf(sc.id).filter(x=>x.thumb)})).filter(x=>x.list.length);
    const n=pool.length;if(!n)return [];
    const spread=n<=3?pool:[pool[0],pool[Math.floor((n-1)/2)],pool[n-1]];
    const chosen=spread.map(x=>({sh:x.list[hashStr(x.sc.id)%x.list.length],i:x.i}));
    while(chosen.length<3){
      const cands=pool.flatMap(x=>x.list.map(sh=>({sh,i:x.i}))).filter(c=>!chosen.some(k=>k.sh.id===c.sh.id));
      if(!cands.length)break;
      chosen.push(cands[hashStr(fid+':'+chosen.length)%cands.length]);
    }
    return chosen.sort((a,b)=>a.i-b.i||(a.sh.order||0)-(b.sh.order||0)).map(c=>c.sh);
  }

  async function saveBackup(){

    const payload={app:'previs-manager',format:1,exported:iso(),films:data.films.map(strip),scenes:data.scenes.map(strip),shots:data.shots.map(strip)};

  function readBackup(file){
    if(!file)return;
    if(file.size>25*1024*1024){toast('That file is too large to be a backup.');return;}
    const rd=new FileReader();
    rd.onerror=()=>toast('The file could not be read.');
    rd.onload=()=>{
      let j;try{j=JSON.parse(String(rd.result));}catch(e){toast('That file is not a Loop 7 backup.');return;}
      const ok=j&&j.app==='previs-manager'&&Array.isArray(j.films)&&Array.isArray(j.scenes)&&Array.isArray(j.shots);
      const clean=a=>(a||[]).filter(d=>d&&typeof d==='object'&&OKID.test(String(d.id)));
      if(!ok){toast('That file is not a Loop 7 backup.');return;}
      restore={exported:j.exported,films:clean(j.films),scenes:clean(j.scenes),shots:clean(j.shots)};
      restore.counts={films:restore.films.length,scenes:restore.scenes.length,shots:restore.shots.length};
      go('films');
    };
    rd.readAsText(file);
  }
  async function runRestore(replace){
    const r=restore;if(!r||!db){toast('Saving is not available in this view.');return;}
    restore=null;render();
    const cols=[['films',r.films],['scenes',r.scenes],['shots',r.shots]];
    const total=cols.reduce((a,c)=>a+c[1].length,0);let n=0;
    for(const [col,docs] of cols){
      for(const d of docs){
        const {id,...body}=d;n++;
        if(n%5===0||n===total)toast('Restoring '+n+' of '+total+'...');
        if(!await W(db.collection(col).doc(id).set(body),'Restore stopped at '+n+' of '+total+'. Try again.'))return;
      }
    }
    if(replace){
      for(const [col,docs] of cols){
        const keep=new Set(docs.map(d=>d.id));
        for(const d of data[col]){if(!keep.has(d.id)&&!await W(db.collection(col).doc(d.id).delete()))return;}
      }
    }
    toast('Restored '+total+' items.');
  }

  let pendingRender=false,filmRun=null,holdRender=0;
  function render(){
    if(filmRun)return;
    if(nav.view==='shot'){
      const sh=shotById(nav.shot);
      if(!sh){if(ready.shots){go('films');}return;}
      $('#home').hidden=true;$('#shotview').hidden=false;
      if(!cur||cur.id!==sh.id)openShot(sh);
      return;
    }
    $('#shotview').hidden=true;$('#home').hidden=false;
    const a=document.activeElement;
    if(a&&a.closest&&a.closest('#screen')&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){pendingRender=true;return;}
    if(Date.now()<holdRender){pendingRender=true;setTimeout(()=>{if(pendingRender)render();},holdRender-Date.now()+30);return;}
    pendingRender=false;
    const el=$('#screen');
    if(nav.view==='scene'){
      const s=scn(nav.scene);
      if(!s){if(ready.scenes)go('films');return;}
      nav.film=s.filmId;el.innerHTML=viewScene(s);
    }else if(nav.view==='script'){
      const f=film(nav.film);
      if(!f){if(ready.films)go('films');return;}
      if(nav.scene&&!scn(nav.scene)){if(ready.scenes)go('film',{film:nav.film});return;}
      el.innerHTML=viewScript(f);fitEdits();
    }else if(nav.view==='film'){
      const f=film(nav.film);
      if(!f){if(ready.films)go('films');return;}
      el.innerHTML=viewFilm(f);
    }else{el.innerHTML=viewFilms();}

  // edits in the script boxes are applied as you type and saved a moment later, so leaving the page or copying never loses them

  function applyScriptEdit(t){

    else if(t.id==='svFrame'){$('#frame').hidden=!t.checked;}
  });
  $('#panel').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='svName')e.target.blur();});
  controls.addEventListener('start',()=>{dragging=true;});
  controls.addEventListener('end',()=>{dragging=false;});
  controls.addEventListener('change',()=>{if(dragging&&draft&&draft.track==='__cam'&&viewMode==='cam')draft.dirty=true;});

  const frameBox=$('#frameBox');
  function resize(){
    {const cb=$('#cardBox'),w0=stage.clientWidth,h0=stage.clientHeight;if(cb&&w0&&h0){const fw0=Math.min(w0,h0*16/9);cb.style.width=fw0+'px';cb.style.height=(fw0*9/16)+'px';}}
    const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;
    renderer.setSize(w,h,false);camera.aspect=w/h;applyLens(curLens);if(isPlace())updatePlaceCam();
    const fw=Math.min(w,h*16/9),fh=fw*9/16;frameBox.style.width=fw+'px';frameBox.style.height=fh+'px';
  }
  new ResizeObserver(resize).observe(stage);
  const _dir=new THREE.Vector3();
  (function loop(){
    requestAnimationFrame(loop);if($('#shotview').hidden)return;
    if(playing&&cur){
      const u=Math.min(1,(playing.el!=null?playing.el:performance.now()-playing.t0)/playing.dur);showAt(u);
      if(!filmRun){ph=Math.round(u*frameCount(cur));updateHead();}
      if(u>=1){if(!filmRun)stopPlay();else playing=null;}
    }
    // keep the orbit point at least 1.5 m ahead, so zooming in flies forward and two-finger pan speed stays steady
    if(controls.enabled&&camera.position.distanceTo(controls.target)<1.5){camera.getWorldDirection(_dir);controls.target.copy(camera.position).addScaledVector(_dir,1.5);}
    if(filmRun&&!playing&&cur&&!isCardShot(cur)&&(cur.lights||[]).some(l=>l.fx))syncLights(filmF);
    {const LA=loaded[activeSet];if(cur&&LA&&LA.anim&&!isCardShot(cur))LA.anim(performance.now()/1000,cur);}
    updateZones(false);
    controls.update();const rr=!isPlace()&&camRoll;if(rr)camera.rotateZ(camRoll);renderer.render(world,isPlace()?placeCam:camera);if(rr)camera.rotateZ(-camRoll);
    if(recCtx)drawRec();
  })();

  /* ---------- play the whole film / render it to a video ---------- */
  let recCv=null,recCtx=null;
  function drawRec(){
    const cv=renderer.domElement,w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;
    const fw=Math.min(w,h*16/9),fh=fw*9/16,pr=cv.width/w;
    if(cardState)paintCardSync(recCtx,recCv.width,recCv.height,cardState.sh,cardState.img);
    else recCtx.drawImage(cv,(w-fw)/2*pr,(h-fh)/2*pr,fw*pr,fh*pr,0,0,recCv.width,recCv.height);
    if(fadeA>0){recCtx.fillStyle='rgba(0,0,0,'+fadeA+')';recCtx.fillRect(0,0,recCv.width,recCv.height);}
  }
  const pad2=n=>String(n).padStart(2,'0');
  function pickMime(){
    const c=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
    return c.find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m))||'';
  }
  const EASE_LBL={inout:'ease in and out',in:'ease in only',out:'ease out only',linear:'even speed'};
  function showDetail(sh,i,n){
    const d=$('#playDetail');
    const chips=[shotNumber(sh)?'Shot '+shotNumber(sh):'',sh.size?szShort(sh.size):'',(Math.max(0.5,+sh.duration_s||3))+' s',(isCardShot(sh)?CARDS[sh.card.type].name:sh.lens_mm+' mm'),stLabel(sh.status),
      (frameCount(sh))+' frames',sh.cam_end?'Camera move: '+(EASE_LBL[sh.cam_ease||'inout'])+(sh.cam_f?', frames '+(sh.cam_f.start||0)+' to '+(sh.cam_f.end==null?frameCount(sh):sh.cam_f.end):'')+(sh.cam_end.lens_mm!==sh.lens_mm?', '+sh.lens_mm+' to '+sh.cam_end.lens_mm+' mm':''):(isCardShot(sh)?'':'Static camera')].filter(Boolean);
    const sc=scn(sh.sceneId);
    d.innerHTML='<h3>'+esc(sh.name)+'</h3><div class="chips">'+chips.map(c=>'<span>'+esc(c)+'</span>').join('')+'</div>'
      +(sc?'<p><span class="lab">Scene</span>'+esc(sceneTitle(sc))+'</p>':'')
      +(secHTML(sh,sc||{})?'<div class="pscript"><span class="lab">Script</span>'+secHTML(sh,sc||{})+'</div>':'')
      +(sh.prompt?'<p><span class="lab">Seedance prompt</span>'+esc(sh.prompt)+'</p>':'');
    d.hidden=false;
  }
  async function playFilm(fid,record,sceneId){
    if(filmRun||refreshing)return;
    if(sceneId){const sc0=scn(sceneId);if(sc0)fid=sc0.filmId;}
    const list=sceneId?playShotsOfScene(sceneId):playShotsOfFilm(fid);
    if(!list.length){toast('Nothing ticked to play.');return;}
    const f=film(fid)||{name:'film'};
    let mime='';
    if(record){
      if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream){toast('Video rendering is not supported in this browser.');return;}
      if(!downloads){toast('Saving files is not available in this view.');return;}
      mime=pickMime();
    }
    const run=filmRun={stop:false,i:0,el:0};
    const durs=list.map(x=>Math.max(0.5,+x.duration_s||3)*1000);
    const total=durs.reduce((a,b)=>a+b,0);
    let recorder=null,chunks=[],wake=null,done=false;
    const sv=$('#shotview'),info=$('#playInfo'),bar=$('#playbar');
    $('#home').hidden=true;sv.hidden=false;sv.classList.add('playing');
    $('#frame').hidden=false;$('#frame').classList.add('cine');
    bar.hidden=false;$('#playStop').textContent=record?'Cancel render':'Exit';
    $('#recWarn').hidden=!record;$('#playPause').hidden=record;$('#playPause').textContent='Pause';
    const onVis=()=>{if(record&&document.hidden&&!run.done){run.stop=true;run.left=true;}};
    document.addEventListener('visibilitychange',onVis);
    window.scrollTo(0,0);
    $('#playStop').onclick=()=>{run.stop=true;};
    document.querySelectorAll('#playbar .tp').forEach(b=>b.hidden=record);
    const nS=list.length,sceneStart=k=>{while(k>0&&list[k-1].sceneId===list[k].sceneId)k--;return k;};
    const seek=(idx,elMs,pause)=>{run.seek=Math.max(0,Math.min(nS-1,idx));run.seekEl=elMs||0;if(pause!=null){run.paused=pause;$('#playPause').textContent=pause?'Resume':'Pause';}};
    const toEnd=()=>seek(nS-1,Math.max(0,durs[nS-1]-40),true);
    $('#pbStart').onclick=()=>seek(0,0);
    $('#pbPrevShot').onclick=()=>seek((run.el||0)>1500?run.i:run.i-1,0);
    $('#pbPrevScene').onclick=()=>{const st=sceneStart(run.i);seek(st<run.i||(run.el||0)>1500?st:(st>0?sceneStart(st-1):0),0);};
    $('#pbNextShot').onclick=()=>{if(run.i>=nS-1)toEnd();else seek(run.i+1,0);};
    $('#pbNextScene').onclick=()=>{let j=run.i+1;while(j<nS&&list[j].sceneId===list[run.i].sceneId)j++;if(j>=nS)toEnd();else seek(j,0);};
    $('#pbEnd').onclick=toEnd;
    $('#playPause').onclick=()=>{run.paused=!run.paused;$('#playPause').textContent=run.paused?'Resume':'Pause';};
    try{if(navigator.wakeLock)wake=await navigator.wakeLock.request('screen');}catch(e){}
    try{
      info.textContent='Loading sets...';$('#loading').hidden=false;$('#loading').textContent='Loading sets...';
      const keys=[...new Set(list.filter(x=>!isCardShot(x)).map(x=>{const sc=scn(x.sceneId);return sc&&SETS[sc.setId]?sc.setId:Object.keys(SETS)[0];}))];
      const withTimeout=(p,ms,msg)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error(msg)),ms))]);
      let ln=0;
      for(const k of keys){ln++;const m='Loading set '+ln+' of '+keys.length+' ('+SETS[k].name+')...';info.textContent=m;$('#loading').textContent=m;await withTimeout(loadSet(k),90000,'The '+SETS[k].name+' set took too long to load');}
      if(keys.length){info.textContent='Loading actors...';$('#loading').textContent='Loading actors...';await withTimeout(loadActors(),60000,'The actors took too long to load');}
      $('#loading').hidden=true;
      resize();
      if(record){
        recCv=document.createElement('canvas');recCv.width=1280;recCv.height=720;recCtx=recCv.getContext('2d');
        recCtx.fillStyle='#000';recCtx.fillRect(0,0,1280,720);
        const st=recCv.captureStream(30);
        recorder=new MediaRecorder(st,mime?{mimeType:mime,videoBitsPerSecond:8000000}:{videoBitsPerSecond:8000000});
        recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
        recorder.start(1000);
      }
      let base=0;
      for(let i=0;i<list.length&&!run.stop;){
        const sh=list[i];
        cur=JSON.parse(JSON.stringify(sh));cur.actors=cur.actors||{};ensureCast(cur);
        camKey=0;ph=0;trk='__cam';viewMode='cam';draft=null;refView=null;previewing=true;playing=null;actorEdit=null;
        activateSet(curKey());applyVisibility();
        applyCamera();
        $('#hudShot').innerHTML='SHOT <b>'+esc(shotNumber(cur))+'</b> '+esc(cur.name.toUpperCase());
        showDetail(sh,i,list.length);
        if(isCardShot(cur)){cardState={sh:cur,img:cur.card.type==='logo'?await loadImg(logoSrc(cur.filmId)):null};showCard(cur);}else{cardState=null;hideCard();}
        let el=run.seekEl||0,last=performance.now();run.seekEl=0;
        if(hasMove(cur))playing={el,dur:durs[i]};
        while(!run.stop){
          if(run.seek!=null)break;
          const now=performance.now();
          if(!run.paused)el+=now-last;run.i=i;run.el=el;
          last=now;
          if(playing)playing.el=el;
          setVeil(fadeAt(cur,Math.min(1,el/durs[i])*frameCount(cur)));filmF=Math.min(1,el/durs[i])*frameCount(cur);
          info.innerHTML=(record?'<b class="rec">REC</b> ':'')+(run.paused?'PAUSED / ':'')+'Shot '+(i+1)+' of '+list.length+' / frame '+Math.min(frameCount(cur),Math.round(el/durs[i]*frameCount(cur)))+' of '+frameCount(cur)+' / '+fmt(Math.floor((base+Math.min(el,durs[i]))/1000))+' of '+fmt(Math.round(total/1000));
          if(el>=durs[i])break;
          await new Promise(r=>requestAnimationFrame(r));
        }
        if(run.seek!=null){const t=run.seek;run.seek=null;i=t;base=durs.slice(0,t).reduce((a,b)=>a+b,0);continue;}
        base+=durs[i];i++;
      }
      if(record&&!run.stop){
        await new Promise(r=>setTimeout(r,400));
        await new Promise(res=>{recorder.onstop=res;recorder.stop();});
        done=true;
        const type=(recorder.mimeType||mime||'video/webm').split(';')[0];
        const ext=type.includes('mp4')?'mp4':'webm';
        const blob=new Blob(chunks,{type});
        const name=(f.name||'film').replace(/[^A-Za-z0-9 _-]+/g,'').trim().replace(/\s+/g,'-')+'-previs.'+ext;
        info.textContent='Saving...';
        try{await downloads.save({filename:name,data:blob});toast('Video ready: '+name);}
        catch(e){toast(e&&e.code==='declined'?'Video not saved.':'The video could not be saved.');}
      }else if(record){toast(run.left?'Render cancelled because you left the app. Nothing was saved.':'Render cancelled. Nothing was saved.');}
    }catch(err){
      toast('Playback stopped: '+((err&&err.message)||err));
    }finally{
      if(recorder&&!done){try{recorder.onstop=null;if(recorder.state!=='inactive')recorder.stop();}catch(e){}}
      recCtx=null;recCv=null;
      if(wake){try{wake.release();}catch(e){}}
      run.done=true;document.removeEventListener('visibilitychange',onVis);
      playing=null;previewing=false;setVeil(0);cardState=null;hideCard();cur=null;filmRun=null;
      bar.hidden=true;$('#recWarn').hidden=true;$('#playDetail').hidden=true;$('#frame').classList.remove('cine');sv.classList.remove('playing');
      if(sceneId)go('scene',{scene:sceneId,film:fid});else go('film',{film:fid});
    }
  }

  /* ---------- start ---------- */
  function onData(name){
    if(!navReady&&ready.films&&ready.scenes&&ready.shots){navReady=true;restoreNav();}
    if(!navReady)return;
    migrateCards();migrateSets();
    render();
    if(nav.view==='shot'&&cur){const sh=shotById(cur.id);if(sh){mergeRemoteSections(sh);resyncShot(sh);}}
  }
  function sub(name){
    db.collection(name).onSnapshot(snap=>{
      data[name]=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
      ready[name]=true;onData(name);
    },()=>{ready[name]=true;onData(name);});
  }
  render();
  (async()=>{
    try{downloads=window.claude&&await window.claude.use('downloads');}catch(e){downloads=null;}
    try{db=window.claude&&await window.claude.use('db');}catch(e){db=null;}
    if(!db){ready.films=ready.scenes=ready.shots=true;navReady=true;render();$('#screen').insertAdjacentHTML('afterbegin','<div class="empty"><b>Sign in to claude.ai to load your films.</b> This tool keeps its films, scenes and shots in the artifact database, which is only available to signed-in viewers.</div>');return;}
    sub('films');sub('scenes');sub('shots');
  })();
})();
</script>
